name: Windows release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise the vendored editor input and projection paths
        run: cargo test --locked -p zorite-editor --lib
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record runner and compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          rustc -Vv | Tee-Object artifacts/toolchain.txt
          cargo -V | Tee-Object -Append artifacts/toolchain.txt
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Out-String | Tee-Object -Append artifacts/toolchain.txt
          git rev-parse HEAD | Set-Content artifacts/commit.txt
      - name: Test filesystem and preservation on Windows
        run: cargo test --locked --no-default-features
      - name: Build native release executable
        run: cargo build --locked --release
      - name: Test bounded native image cache
        run: cargo test --locked --release --bin nxmd
      - name: Test Markdown projection and source mapping
        run: cargo test --locked --release --test editor_projection
      - name: Inspect native dependencies and package executable
        shell: pwsh
        run: ./scripts/windows-package.ps1
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: nxmd-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Native window smoke test
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/windows-smoke.ps1 -Executable ./target/release/nxmd.exe
      - name: Verify multiline mouse selection and clipboard on Windows
        shell: pwsh
        run: |
          $exe = './target/release/nxmd.exe'
          foreach ($ending in 'LF','CRLF') {
            ./scripts/windows-smoke.ps1 -Executable $exe -SelectionEnding $ending -TypedBreak -ResultDirectory "smoke-results/typed-$ending"
          }
          ./scripts/windows-smoke.ps1 -Executable $exe -SelectionEnding LF -SpaceControl -ResultDirectory smoke-results/explicit-spaces
          ./scripts/windows-smoke.ps1 -Executable $exe -SelectionEnding LF -WrappedMarkdown -ResultDirectory smoke-results/wrapped-markdown
      # Historical artifacts expire; their absence must not block a release.
      - name: Download comparison baseline
        id: baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44532247903
          pattern: nxmd-windows-x64-*
          merge-multiple: true
          path: baseline-release
      - name: Compare native process metrics
        if: steps.baseline.outcome == 'success'
        shell: pwsh
        run: ./scripts/windows-performance.ps1 -Baseline ./baseline-release/nxmd.exe -Candidate ./target/release/nxmd.exe
      - name: Install Japanese basic typing on the disposable Windows runner
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $language = 'Language.Basic~~~ja-JP~0.0.1.0'
          try {
            if ((Get-WindowsCapability -Online -Name $language).State -ne 'Installed') {
              Add-WindowsCapability -Online -Name $language -ErrorAction Stop | Format-List
            }
          } catch { Write-Warning $_ }
      - name: Activate the Japanese input profile for the probe
        shell: pwsh
        continue-on-error: true
        run: |
          $languages = Get-WinUserLanguageList
          if ('ja-JP' -notin $languages.LanguageTag) { $languages.Add('ja-JP') }
          Set-WinUserLanguageList -LanguageList $languages -Force
          $profile = (Get-WinUserLanguageList | Where-Object LanguageTag -eq 'ja-JP').InputMethodTips | Select-Object -First 1
          if ($profile) { Set-WinDefaultInputMethodOverride -InputTip $profile }
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips
          Start-Process ctfmon.exe
      - name: Observe native IME composition when the runner has Japanese input
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Executable ./target/release/nxmd.exe -ImeProbe -ResultDirectory smoke-results/ime
      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxmd-windows-validation-${{ github.sha }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 30
