out of the use or inability to use the\n      Work (including but not limited to damages for loss of goodwill,\n      work stoppage, computer failure or malfunction, or any and all\n      other commercial damages or losses), even if such Contributor\n      has been advised of the possibility of such damages.\n\n\n   9. Accepting Warranty or Additional Liability. While redistributing\n      the Work or Derivative Works thereof, You may choose to offer,\n      and charge a fee for, acceptance of support, warranty, indemnity,\n      or other liability obligations and/or rights consistent with this\n      License. However, in accepting such obligations, You may act only\n      on Your own behalf and on Your sole responsibility, not on behalf\n      of any other Contributor, and only if You agree to indemnify,\n      defend, and hold each Contributor harmless for any liability\n      incurred by, or claims asserted against, such Contributor by reason\n      of your accepting any such warranty or additional liability.\n\n\n   END OF TERMS AND CONDITIONS\n",
            "THIRD_PARTY.md": "# Third-party notices\r\n\r\nThe editor is provided by zorite-editor (MIT), copyright 2026 Will Lehnertz.\r\nThe initial SyntaxStyle palette in src/theme.rs is adapted from its MIT-licensed demo:\r\nhttps://github.com/packetThrower/zorite\r\n\r\nMIT License\r\n\r\nCopyright (c) 2026 Will Lehnertz\r\n\r\nPermission is hereby granted, free of charge, to any person obtaining a copy\r\nof this software and associated documentation files (the \"Software\"), to deal\r\nin the Software without restriction, including without limitation the rights\r\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\r\ncopies of the Software, and to permit persons to whom the Software is\r\nfurnished to do so, subject to the following conditions:\r\n\r\nThe above copyright notice and this permission notice shall be included in all\r\ncopies or substantial portions of the Software.\r\n\r\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\r\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\r\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\r\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\r\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\r\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\r\nSOFTWARE.\r\n\r\nNative filesystem notifications use notify 8.2.2 (CC0-1.0):\r\nhttps://github.com/notify-rs/notify\r\nhttps://creativecommons.org/publicdomain/zero/1.0/legalcode\r\n\nGPUI (gpui-pre 0.3.12), Apache-2.0. The complete Apache license is included\nin LICENSE-APACHE-2.0.txt. Upstream: https://github.com/zed-industries/zed/tree/main/crates/gpui\n",
            "SHA256SUMS.txt": "752daf2fb234ca4a1fa372c073fe127f44b7b90fd2529ae44273a64f9d53da7a  LICENSE-APACHE-2.0.txt\n4572888af7840f2ce0531c96a87880bb876db7cf90cd280cee87db1d4ffe4f28  LICENSE.txt\n701ff45ff415a3b56e02205c2b63f65e209da530e362604136c90ca60f5d127a  README.txt\n513ecfdf3f4ec43d152abb248f7899d6b0905f8f75120928e1ba44f5c4bc6d9e  THIRD_PARTY.md\n5a1bad1fae83d9764bb4858dc4fb1df8b4b705b3cdea68615cfcb6959f3016d2  nxmd.exe\n",
            "README.txt": "nxmd v0.2.0-alpha - Initial Alpha Release\r\nWindows x64 portable package\r\n\r\nGETTING STARTED\r\n1. Extract all files from the ZIP into a folder.\r\n2. Run nxmd.exe. Use Open vault (Ctrl+O) to select a local notes folder.\r\n3. For initial alpha testing, use a copy of your vault.\r\n\r\nYou can also launch from PowerShell with a vault path:\r\n  .\\nxmd.exe \"C:\\Notes\"\r\n\r\nCtrl+N: new note. Ctrl+S: save. Ctrl+W: close tab.\r\nCtrl+Shift+L: toggle explorer. F5: refresh explorer.\r\nThe previous vault and tab paths restore on the next launch.\r\n\r\nWINDOWS REQUIREMENTS\r\nIntended target: Windows 10/11, x64, with Direct3D 11 support and a compatible\r\ngraphics driver. Automated validation used windows-latest (Windows Server);\r\nthis does not certify every Windows 10/11 installation or graphics driver.\r\nThe executable imports VCRUNTIME140.dll. Install the current Microsoft Visual\r\nC++ x64 Redistributable if this runtime is missing:\r\nhttps://learn.microsoft.com/cpp/windows/latest-supported-vc-redist\r\nNo Rust toolchain, Node.js, Electron, Chromium, or WebView2 is required.\r\nThis unsigned alpha may trigger a Windows SmartScreen reputation warning.\r\n\r\nALPHA LIMITATIONS\r\nUse backups: autosave is debounced, and unsaved edits have no crash recovery.\r\nIME and Windows shell drag-and-drop still need comprehensive manual acceptance.\r\nObsidian image embeds render as standalone blocks; inline wiki embeds and embed\r\nsizing are not supported. Animated images display a first frame. There is no\r\nimage zoom/editing or automatic link rewriting after file moves. Image paste\r\ninserts at the caret rather than replacing selected text. Very large document\r\nrendering, conflict reload/merge, folder management controls, and settings remain\r\nareas for further development. Image resource limits are documented at:\r\nhttps://github.com/nxway/nxmd/blob/v0.2.0-alpha/docs/images.md\r\n\r\nDiagnostics: %LOCALAPPDATA%\\nxmd\\logs\r\nPlease include reproduction steps and relevant local logs when reporting issues:\r\nhttps://github.com/nxway/nxmd/issues\r\nReview logs before sharing, since they can contain local paths.\r\n\r\nBUILD PROVENANCE\r\nRelease tag: v0.2.0-alpha\r\nCommit: c8d3079261169e7bac0956c4b6fd1a5e604a10da\r\nVerified build: https://github.com/nxway/nxmd/actions/runs/43239301300\r\nIndependent native regression: https://github.com/nxway/nxmd/actions/runs/43241151840\r\nThe executable is unchanged from the verified CI artifact; it was not rebuilt.\r\nIts internal diagnostic version string remains 0.1.0.\r\nSHA256SUMS.txt contains SHA-256 hashes for the files in this package.\r\n"
          }''')
          package = Path("package"); package.mkdir()
          shutil.copyfile(src / "nxmd.exe", package / "nxmd.exe")
          for name, content in payload.items():
              assert Path(name).name == name
              (package / name).write_bytes(content.encode("utf-8"))
          for line in (package / "SHA256SUMS.txt").read_text().splitlines():
              digest, name = line.split("  ", 1)
              assert hashlib.sha256((package / name).read_bytes()).hexdigest() == digest, name
          archive = Path("nxmd-v0.2.0-alpha-windows-x64.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(package.iterdir()):
                  info = zipfile.ZipInfo(p.name, date_time=(2026, 11, 12, 0, 0, 0))
                  info.create_system = 0; info.external_attr = 0x20
                  z.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read("nxmd.exe")).hexdigest() == expected_exe
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + ".sha256").write_text(f"{checksum}  {archive.name}\n", encoding="ascii")
          release = json.loads(subprocess.check_output(["gh", "api", "repos/nxway/nxmd/releases/443138227"]))
          assert release["draft"] and release["prerelease"]
          assert release["tag_name"] == "v0.2.0-alpha" and release["target_commitish"] == commit
          assert release["name"] == "nxmd v0.2.0-alpha — Initial Alpha Release"
          assert not release["assets"], "Unexpected existing assets; refusing to overwrite"
          print("Verified executable SHA-256:", expected_exe)
          print("ZIP SHA-256:", checksum)
      - name: Upload verified assets to the existing draft
        run: gh release upload v0.2.0-alpha nxmd-v0.2.0-alpha-windows-x64.zip nxmd-v0.2.0-alpha-windows-x64.zip.sha256 --repo nxway/nxmd
      - name: Publish as a pre-release at the verified source commit
        run: gh release edit v0.2.0-alpha --repo nxway/nxmd --draft=false --prerelease --latest=false --target c8d3079261169e7bac0956c4b6fd1a5e604a10da
      - name: Verify published release and tag
        run: |
          gh release view v0.2.0-alpha --repo nxway/nxmd --json url,tagName,targetCommitish,isDraft,isPrerelease,assets
          gh api repos/nxway/nxmd/git/ref/tags/v0.2.0-alpha
