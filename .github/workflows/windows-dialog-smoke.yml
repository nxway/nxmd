name: Windows dialog regression
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Windows release run built from this workflow ref's exact commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  dialogs:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: nxmd-windows-x64-*
          merge-multiple: true
          path: release-under-test
      - name: Verify executable matches checked-out commit
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force smoke-results | Out-Null
          Copy-Item release-under-test/commit.txt smoke-results/executable-commit.txt
          Get-FileHash release-under-test/nxmd.exe -Algorithm SHA256 | Out-String | Set-Content smoke-results/executable-sha256.txt
          $expected = (git rev-parse HEAD).Trim()
          $actual = (Get-Content release-under-test/commit.txt -Raw).Trim()
          @{
            source_run_id = $env:SOURCE_RUN_ID
            test_commit = $expected
            executable_commit = $actual
          } | ConvertTo-Json | Tee-Object smoke-results/provenance.json
          if ($actual -cne $expected) {
            throw "Executable commit mismatch: source run $env:SOURCE_RUN_ID contains $actual, but these tests are from $expected. Select a successful Windows release run built from $expected."
          }
      - name: Exercise native dialogs
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Executable ./release-under-test/nxmd.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-dialog-regression-${{ github.run_id }}
          path: smoke-results/
          if-no-files-found: error
