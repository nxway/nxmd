name: Native selection baseline
on:
  push:
    branches: [investigate/windows-multiline-selection-1412a6b]
    paths:
      - .github/workflows/selection-baseline.yml
      - scripts/windows-plain-selection.ps1
      - scripts/windows-smoke.ps1
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ending: LF
            label: LF
          - ending: CRLF
            label: CRLF
          - ending: LF
            control: -SpaceControl
            label: spaces
          - ending: LF
            control: -WrappedMarkdown
            label: wrapped-markdown
          - ending: LF
            control: -TypedBreak
            label: typed-LF
          - ending: CRLF
            control: -TypedBreak
            label: typed-CRLF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44597418054
          name: nxmd-windows-x64-1412a6b3044b0c882cedf74fb1315a68995c2175
          path: affected
      - shell: pwsh
        run: |
          if ((Get-Content affected/commit.txt -Raw).Trim() -cne '1412a6b3044b0c882cedf74fb1315a68995c2175') { throw 'Wrong executable revision' }
          Get-FileHash affected/nxmd.exe
          ./scripts/windows-smoke.ps1 -Executable affected/nxmd.exe -SelectionEnding ${{ matrix.ending }} ${{ matrix.control }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ matrix.label }}
          path: smoke-results/
